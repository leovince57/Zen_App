 $('#app').innerHTML=`<div class="mobile-tools"><span class="mini-brand">人间净土 · 交互原型</span><button data-action="page-menu">${role==='teacher'?'导师端':'学员端'} · 页面导航</button></div><main class="preview">${sidebar()}<div class="phone-wrap"><section class="phone" aria-label="${role==='teacher'?'导师':'学员'}端手机原型">${statusBar()}<div class="phone-viewport">${view.bar||''}<div class="phone-content" id="screen-content" ${ui.modal?'inert':''}>${view.body}</div>${view.footer||''}${view.bottom||''}${ui.toast?`<div class="toast ${ui.toastError?'error-toast':''}" role="status">${esc(ui.toast)}</div>`:''}${modal()}</div><div class="gesture" aria-hidden="true"></div></section></div><aside class="preview-context"><div class="context-line"></div><h2>${title}</h2><p>${desc}</p><div class="flow-index">${['导师安排','闻 · 学理论','思 · 自检反思','修 · 实践','提交与导师确认'].map((v,i)=>`<span class="${i===index?'active':''}"><i>${i+1}</i>${v}</span>`).join('')}</div><p class="scope-note">主题与层级来自2024-04-13修学导图。单元划分已采纳；折叠目录、教材和自检表待补充。实践目标与周期由导师设置，各单元默认并行。</p></aside></main>`;
 $('.phone-content').scrollTop=scroll;
 if(focusId&&$('#'+focusId))$('#'+focusId).focus({preventScroll:true});
 if(ui.modal)document.querySelectorAll('.bottom-nav,.app-bar,.action-footer').forEach(x=>x.inert=true);
 scalePhone();
}
function scalePhone(){const wide=innerWidth>1080,side=innerWidth>700;const availableW=side?innerWidth-(wide?220+205+116+68:205+45+68):innerWidth-36;const availableH=innerHeight-(side?54:76);const scale=Math.min(1,availableW/413,availableH/852);document.documentElement.style.setProperty('--phone-scale',Math.max(.35,scale).toFixed(4));}
function validationError(message){ui.error=message;render(true);requestAnimationFrame(()=>{document.querySelector('[role="alert"]')?.scrollIntoView({block:'center',behavior:'smooth'});});}
function shortcut(next){if(role==='student'){if(current().student!=='m1')activeId='karma';if(['read','think','submit'].includes(next)&&current().kind==='practice')activeId='karma';navigate(next);}else{
 if(next==='review'){const a=data.assignments.find(a=>a.id===activeId&&a.status==='submitted')||owned(activeStudent).find(a=>a.status==='submitted')||data.assignments.find(a=>a.status==='submitted')||current();activeId=a.id;activeStudent=a.student;}
 navigate(next);
}}
const actions={
 'select-lotus':btn=>{if(!LOTUS_BRANCHES.some(b=>b.name===btn.dataset.branch))return;ui.lotusBranch=btn.dataset.branch;render(true);requestAnimationFrame(()=>document.querySelector(`[data-branch="${ui.lotusBranch}"]`)?.focus({preventScroll:true}));},
 'map-gaps':()=>openInfo('划分规则与资料缺口','理论按完整主题、实践按可独立安排的事项划分；七信自检保留原目录名称，8项分别安排。默认无硬性前置，目标和周期由导师设置。专修／选修目录、真实教材及自检表仍待补充。'),
 'configure-assignment':()=>navigate('configure'),
 'save-configuration':()=>{const a=current();if(a.status!=='active')return;const instruction=$('#config-instruction')?.value.trim()||'',rawTarget=$('#config-target')?.value.trim()||'',target=Number(rawTarget),period=$('#config-period')?.value.trim()||'';if(a.required.practice&&(!instruction||!period||!Number.isInteger(target)||target<1||target>10000000))return validationError('请填写实践内容、1至10000000之间的整数目标及周期。');a.practiceInstruction=instruction;a.target=a.required.practice?target:null;a.measureUnit=$('#config-unit')?.value||a.measureUnit;a.period=period;a.guidance=$('#config-guidance')?.value.trim()||a.guidance;ui.configDraft=null;refreshDefinition(a);persist();navigate('review');flash('已保存本次学习要求');},
 'home':()=>navigate('home'), 'return-task':()=>navigate('task'), 'close-modal':closeModal, 'page-menu':()=>openModal('pages'),
 'continue-task':()=>navigate(current().status==='completed'?['read','think','practice'].find(k=>current().required[k]):incompleteStage(current())),
 'open-submit':()=>navigate('submit'), 'view-submission':()=>navigate('submit'),
 'notices':()=>openInfo('修学消息',`导师已为你指派${owned().length}个学习单元，其中${owned().filter(a=>a.status==='submitted').length}个待确认。可在“历程”中查看进度与学习记录。`),
 'public-guide':()=>openInfo('导读', '导读用于认识人间净土修学体系，可随时查看。课程资料将在接入原有课程库后呈现。'),
 'locked':()=>openInfo('该内容尚未安排','每个人的修学情况不同，请按导师当前的安排学习。已安排和已完成的内容可从“我的修学”进入。'),
 'audio-info':()=>openInfo('音频资料','本原型未接入真实音频。当前可阅读课程讲义示例，演示阅读进度与本人学完确认。'),
 'reader-menu':()=>openModal('materials'),
 'reader-prev':()=>{const a=current(),m=currentMaterial();ui.readerPage=Math.max(1,(ui.readerPage||m.bookmark||1)-1);if(!isReadOnly(a)){m.bookmark=ui.readerPage;persist();}render(false);},
 'reader-next':()=>{const a=current(),m=currentMaterial();ui.readerPage=Math.min(3,(ui.readerPage||m.bookmark||1)+1);if(!isReadOnly(a)){m.bookmark=ui.readerPage;persist();}render(false);},
 'save-read':()=>{const a=current();if(isReadOnly(a))return;const m=currentMaterial();m.confirmed=!!$('#read-confirm')?.checked;a.readConfirmed=a.materials.every(x=>x.confirmed);persist();navigate('task');flash(`已保存资料进度（${a.materials.filter(x=>x.confirmed).length}/${a.materials.length}）`);},
 'save-think':()=>{const a=current();if(isReadOnly(a))return;if(a.answers.some(x=>!x))return validationError('请完成上面的3项自检。');if(!a.reflection.trim())return validationError('请写下本次学习的反思。');a.reflectionSaved=true;a.returnNote='';persist();navigate('task');flash('自检与反思已保存');},
 'count-one':()=>{if(!isReadOnly(current())){ui.count=Math.min(100000,ui.count+1);render(true);}},
 'count-ten':()=>{if(!isReadOnly(current())){ui.count=Math.min(100000,ui.count+10);render(true);}},
 'count-undo':()=>{ui.count=Math.max(0,ui.count-1);render(true);},
 'manual-toggle':()=>{ui.manual=!ui.manual;ui.error='';render(true);if(ui.manual)$('#manual-count')?.focus();},
 'manual-apply':()=>{const n=Number($('#manual-count')?.value);if(!Number.isInteger(n)||n<1||n>100000)return validationError('请填写1至100000之间的整数数量。');ui.count=n;ui.manual=false;ui.error='';render(true);},
 'save-practice':()=>{const a=current();if(isReadOnly(a)||!Number.isInteger(ui.count)||ui.count<1)return;const n=ui.count;a.practiceTotal+=n;a.records.push({count:n,date:'10月22日',time:new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Shanghai'}).format(new Date())});ui.count=0;persist();navigate('task');flash(`已记录实践${n}${a.measureUnit}`);},
 'submit-assignment':()=>{const a=current();if(isReadOnly(a))return;if(!ready(a))return validationError('请先完成本次安排要求的学习与实践。');if(!$('#submit-confirm')?.checked)return validationError('请先确认以上学习记录属实。');a.snapshot=snapshotOf(a);a.submissions.push(JSON.parse(JSON.stringify(a.snapshot)));a.status='submitted';a.submittedAt='10月22日 '+new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Shanghai'}).format(new Date());persist();navigate('sent');},
 'learning-tab':btn=>{ui.listTab=btn.dataset.value;render(false);},'student-tab':btn=>{ui.studentTab=btn.dataset.value;render(false);},
 'approve-review':()=>{ui.reviewComment='';openModal('approve');},
 'confirm-approve':()=>{const a=current();if(a.status!=='submitted'||a.pendingDefinition||!ready(a))return;a.status='completed';a.completedAt='10月22日';a.teacherComment=ui.reviewComment.trim();a.returnNote='';persist();ui.modal=null;render(false);flash('已确认本单元完成');},
 'return-review':()=>{ui.returnText='';openModal('return');},
 'confirm-return':()=>{const a=current();if(a.status!=='submitted')return;if(!ui.returnText.trim()){ui.error='请填写需要继续学习的具体建议。';render(true);return;}a.returnNote=ui.returnText.trim();a.status='active';if(a.required.think)a.reflectionSaved=false;persist();ui.modal=null;render(false);flash('已发回，等待学员继续学习');},
 'open-next-review':()=>{const a=data.assignments.find(a=>a.status==='submitted');if(a)navigate('review',{id:a.id});},
 'publish-assignment':()=>{const ids=ui.assignSelected.filter(id=>canAssignUnit(unitById(id))&&!owned(activeStudent).some(a=>a.unitId===id&&a.status!=='completed'));if(!ids.length)return validationError('请选择尚未登记且内容可辨识的原图主题。');const created=ids.map((id,i)=>newAssignment(id,activeStudent,'new-'+Date.now()+'-'+i,{guidance:ui.assignGuidance.trim()||'按导师本次安排学习，完成后提交。'}));data.assignments.push(...created);ui.published=created;data.lastPublished={student:activeStudent,ids:created.map(a=>a.id)};ui.assignSelected=[];persist();navigate('published');},
 'unit-filter':btn=>{ui.assignFilter=btn.dataset.value;render(true);},
 'remove-unit':btn=>{ui.assignSelected=ui.assignSelected.filter(id=>id!==btn.dataset.unit);render(true);},
 'choose-unit':()=>{if(!canAssignUnit(unitById(ui.previewUnitId)))return;if(owned(activeStudent).some(a=>a.unitId===ui.previewUnitId&&a.status!=='completed'))return;ui.assignSelected=[...new Set([...ui.assignSelected,ui.previewUnitId])];navigate('assign');},
 'load-pending':()=>openInfo('资料或导师要求待补齐','当前原图没有给出完整资料与完成标准，不生成已完成或待审核样例。'),
 'confirm-pending':()=>openInfo('资料或导师要求待补齐','当前原图没有给出完整资料与完成标准，不生成已完成或待审核样例。'),
 'reset-demo':()=>openModal('reset'),
 'confirm-reset':()=>{ui.published=[];ui.assignSelected=[];ui.assignTargets={};ui.assignFilter='全部';data=seed();recovery=false;ui.storageError=false;activeId='karma';activeStudent='m1';ui.listTab='active';ui.lotusBranch=null;persist();navigate(role==='teacher'?'students':'home');},
 'retry-storage':()=>{if(persist())flash('演示记录已保存');else flash('暂时无法保存，请保持页面并重试。',true);},
 'about':()=>openInfo('手机交互原型','用于预览导师安排、学员闻思修、提交与导师确认。主题名称与层级依据修学导图。人物及指派为演示，单元划分已确定，实际资料未接入，实践要求由导师设置。操作仅在本浏览器保存。'),
};
document.addEventListener('click',event=>{
 const roleBtn=event.target.closest('[data-role]');if(roleBtn){switchRole(roleBtn.dataset.role);return;}
 const shortcutBtn=event.target.closest('[data-shortcut]');if(shortcutBtn){shortcut(shortcutBtn.dataset.shortcut);return;}
 const go=event.target.closest('[data-go]');if(go){if(go.disabled)return;const next=go.dataset.go;if(role==='teacher'&&next==='profile'){navigate('profile');return;}if(role==='teacher'&&next==='records'){navigate('arrangement-history');return;}if(go.dataset.student)activeStudent=go.dataset.student;const id=go.dataset.id;if(id){activeId=id;activeStudent=current().student;}if(go.dataset.unit)ui.previewUnitId=go.dataset.unit;navigate(next,{material:go.dataset.material});return;}
 const btn=event.target.closest('[data-action]');if(!btn||btn.disabled)return;
 if(btn.dataset.action==='modal-backdrop'){if(event.target===btn)closeModal();return;}
 actions[btn.dataset.action]?.(btn);
});
document.addEventListener('input',event=>{
 const e=event.target,a=current();
 const configKeys={'config-instruction':'practiceInstruction','config-target':'target','config-unit':'measureUnit','config-period':'period','config-guidance':'guidance'};if(configKeys[e.id])ui.configDraft={...(ui.configDraft?.id===a.id?ui.configDraft:{}),id:a.id,[configKeys[e.id]]:e.value};
 if(e.id==='reflection'&&!isReadOnly(a)){a.reflection=e.value;a.reflectionSaved=false;persist();}
 if(e.id==='question'&&!isReadOnly(a)){a.question=e.value;a.reflectionSaved=false;persist();}
 if(e.id==='assign-guidance')ui.assignGuidance=e.value;
 if(e.dataset.unitTarget)ui.assignTargets[e.dataset.unitTarget]=e.value;
 if(e.id==='assign-due')ui.assignDue=e.value;
 if(e.id==='return-text')ui.returnText=e.value;
 if(e.id==='review-comment')ui.reviewComment=e.value;
 if(e.id==='student-search'){ui.search=e.value;const filtered=students.filter(s=>!ui.search.trim()||s.name.includes(ui.search.trim()));$('#student-results').innerHTML=filtered.length?filtered.map(studentRow).join(''):'<div class="empty"><h2>未找到相关学员</h2><p>请尝试其他法名。</p></div>';}
});
document.addEventListener('change',event=>{const e=event.target,a=current();if(e.id==='read-confirm')ui.readDraft=e.checked;if(e.name?.startsWith('answer-')&&!isReadOnly(a)){a.answers[Number(e.name.slice(-1))]=e.value;a.reflectionSaved=false;persist();}if(e.name==='assign-unit'){ui.assignSelected=e.checked?[...new Set([...ui.assignSelected,e.value])]:ui.assignSelected.filter(v=>v!==e.value);render(true);}if(e.id==='assign-mode'){ui.assignMode=e.value;render(true);}});
document.addEventListener('keydown',event=>{const svgButton=event.target.closest?.('svg [role="button"]');if(svgButton&&['Enter',' '].includes(event.key)){event.preventDefault();svgButton.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;}if(!ui.modal)return;if(event.key==='Escape'){event.preventDefault();closeModal();return;}if(event.key==='Tab'){const nodes=[...document.querySelectorAll('.sheet button:not(:disabled),.sheet input,.sheet textarea,.sheet select')];const first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement?.id==='dialog-title')){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
addEventListener('resize',scalePhone);
addEventListener('popstate',event=>{if(event.state){({role,page,activeId,activeStudent}=event.state);ui.recordsFrom=event.state.recordsFrom||'journey';ui.materialId=event.state.materialId||null;ui.previewUnitId=event.state.previewUnitId||ui.previewUnitId;}else{const q=routeParams();role=q.get('role')==='teacher'?'teacher':'student';page=q.get('page')||(role==='teacher'?'students':'home');activeId=q.get('task')||'karma';ui.recordsFrom=['practice','task'].includes(q.get('from'))?q.get('from'):'journey';ui.materialId=q.get('material');ui.previewUnitId=q.get('unit')||ui.previewUnitId;activeStudent=role==='teacher'&&students.some(s=>s.id===q.get('student'))?q.get('student'):current().student;}ui.modal=null;ui.error='';ui.readerPage=null;ui.readDraft=null;ui.count=0;render(false);});
history.replaceState({role,page,activeId,activeStudent,recordsFrom:ui.recordsFrom,materialId:ui.materialId,previewUnitId:ui.previewUnitId},'',url());
render(false);
})();
