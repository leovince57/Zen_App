function phaseLinks(a){return `<div class="phase-track">${[['read','闻','讲解资料'],['think','思','自检反思'],['practice','修','配套实践']].map(([to,s,t])=>`<button data-go="${to}" data-id="${a.id}"><span>${s}</span>${t}</button>`).join('')}</div>`;}
function home(){const focus=owned().find(a=>a.status!=='completed'),selected=ui.lotusBranch||branchOf(focus)||'正见',state=lotusState(selected,focus),a=state.active[0],catalog=COURSES.filter(c=>selected==='正见'||c.branch===selected);return {bar:`<header class="app-bar"><div class="app-wordmark">${icon('lotus')}人间净土</div><button class="icon-btn" data-action="notices" aria-label="修学消息">${icon('bell')}</button></header>`,body:`<div class="pad lotus-home"><div class="lotus-heading"><div><h1>我的修学</h1><p>法师安排课程 · 闻思修相伴</p></div><span class="tag gray">${owned().length}门已安排</span></div>${studyLotus(selected,focus,a)}<div class="lotus-relation"><span><b>解</b>正见 · 贯穿各课的理论</span><span><b>行</b>四类课程 · 落实修学</span></div><section id="lotus-arrangements" aria-live="polite"><div class="lotus-branch-head"><h2>${selected}<span>${selected==='正见'?'解':'行'}</span></h2><span>${selected==='正见'?'已开放课程的理论汇总':state.active.length+'门已安排'}</span></div>${a?`<article class="lotus-course"><div class="focus-top"><span class="breadcrumb">${esc(branchOf(a))}课 · ${selected==='正见'?'理论入口':'课程安排'}</span>${tag(a)}</div><div class="lotus-course-title"><h3>${esc(courseById(a.courseId).title)}</h3></div>${phaseLinks(a)}<button class="primary" data-go="${selected==='正见'?'read':'task'}" data-id="${a.id}">${selected==='正见'?'查看本课讲解资料':'进入课程'} ${icon('arrow')}</button></article>${state.active.slice(1).map(x=>row(selected==='正见'?'read':'task',courseById(x.courseId).title,`${branchOf(x)}课 · ${status(x)}`,'book',`data-id="${x.id}"`)).join('')}`:`<div class="lotus-empty"><p>这个方向暂未安排课程</p><small>法师开放后，可从花瓣进入课程学习。</small></div>`}</section><div class="section-title"><h2>${selected==='正见'?'课程理论目录':selected+'课程目录'}</h2><span class="sub">${catalog.length}门</span></div>${catalog.map(c=>row('course',c.title,isOpened(c)?'已开放 · '+c.branch+'课':'未安排 · 课程锁定',isOpened(c)?'book':'lock',`data-course="${c.id}"`)).join('')}${row('guide','公共导读','认识体系与修学导图 · 不计入24门','leaf')}${row('daily','我的自检定课','从已开放内容中自行设置','clock')}${row('learning','全部已安排课程','各课独立记录，可并行学习','list')}<p class="plain-note center">24门课程按个人情况安排，不代表24个阶段。</p></div>`,bottom:bottom('home')};}
function pairing(c){return `<section class="course-pairing"><div class="section-title"><h2>正见 · 理论范围</h2><span class="tag gray">解</span></div><p class="source-path">${c.theoryPath.map(esc).join(' → ')}</p><p class="plain-note">本课讲解资料与必学范围待接入，不编写替代讲义。</p><div class="section-title"><h2>${esc(c.branch)} · 行门配套</h2><span class="tag gray">行</span></div>${c.checks.length?`<div class="confirmed-pairing"><strong>课程初稿已明确对应</strong>${list(c.checks)}<p>以上自检归“思”；具体表单、必填与完成规则仍待确认。</p></div>`:'<p class="sub">本课尚无已确认的具体配套。</p>'}${c.practices.length?list(c.practices):''}${notice('待法师确认',c.pending.join('；'))}<p class="plain-note">修的范围尚待确认，不预设念佛次数、拜数、周期或统一完成分数。没有独立实践的课程，不强行添加“修”。</p></section>`;}
function course(){const c=courseById(courseId),opened=isOpened(c),existing=owned(role==='teacher'?activeStudent:'m1').find(a=>a.courseId===c.id&&a.status!=='completed');const locked=role==='student'&&!opened;return {bar:header(role==='teacher'?'固定课程配置':'课程详情',role==='teacher'?'assign':'home'),body:`<div class="pad"><div class="breadcrumb">${esc(c.branch)}课 · 四类24门</div><h1 class="detail-title">${esc(c.title)}</h1>${locked?`${notice('尚未安排 · 内容锁定','当前仅展示课程名称。讲解资料、自检与实践须由法师开放课程后进入。')}<p class="plain-note">请按法师当前安排修学。公共导读可随时查看。</p>`:`${notice('课程配套待法师确认','这是课程设计预览。已明确的对应关系与待确认配套分开列出；日常安排不逐张选择表单。')}${pairing(c)}`}${role==='teacher'?row('directory','核对完整行门目录','保留原图归属；未绑定的内容不会默认开放','list'):''}</div>`,footer:role==='teacher'?foot(existing?'本课已安排':'加入本次安排','choose-course','当前发布为演示安排，未确认配置不能判定完成。',!!existing):opened?`<footer class="action-footer"><button class="primary" data-go="task" data-id="${existing.id}">进入已安排课程</button></footer>`:foot('课程尚未开放','locked','由法师决定开放哪门或多门课程。',true)};}
function task(){const a=current(),c=courseById(a.courseId);return {bar:header('课程学习','learning'),body:`<div class="pad"><div class="breadcrumb">${esc(c.branch)}课</div><h1 class="detail-title">${esc(c.title)}</h1>${tag(a)}<div class="guidance"><div class="guidance-head">慧明法师 · 本次指导（演示）</div><p>${esc(a.guidance)}</p>${a.requirements?`<p class="space-top-sm">本次要求：${esc(a.requirements)}</p>`:''}</div><section class="stage-block"><div class="stage-head"><span class="stage-symbol">闻</span><h2>讲解资料</h2><small>待接入</small></div>${row('read',c.title+'讲解资料','按正见原图路径归档')}</section><section class="stage-block"><div class="stage-head"><span class="stage-symbol">思</span><h2>自检与反思</h2><small>${a.reflectionAt?'心得已保存':'可记录心得'}</small></div>${row('think','专项自检、心得与问题',c.checks.length?c.checks.join('、'):'自检配套待法师确认','edit')}</section><section class="stage-block"><div class="stage-head"><span class="stage-symbol">修</span><h2>配套实践</h2><small>待确认</small></div>${row('practice','查看本课实践范围','待法师确认，不强加独立实践','lotus')}</section>${notice('本课配套仍待确认','可以查看结构、记录心得与问题。真实资料、表单和完成要求齐备前，不生成已学完结果。')}${row('course','查看本课固定配置','理论与行门配套、待确认内容','list',`data-course="${c.id}"`)}${row('records','本课学习记录','回看安排、心得与指导','clock',`data-id="${a.id}"`)}</div>`,footer:foot('查看提交要求','open-submit')};}
function read(){const c=courseById(current().courseId);return {bar:header('闻 · 讲解资料','task'),body:`<div class="pad"><h1 class="detail-title">${esc(c.title)}</h1><p class="source-path">${c.theoryPath.map(esc).join(' → ')}</p>${notice('讲解资料待接入','当前保留课程范围，不使用示例讲义替代实际教材。资料进度与学完确认将在真实资料接入后使用。')}<div class="empty">${icon('book')}<h2>${esc(c.title)}讲解资料</h2><p>本课教材、文件目录与必学范围待补齐。</p></div></div>`,footer:foot('返回课程','return-task')};}
function think(){const a=current(),c=courseById(a.courseId);return {bar:header('思 · 自检与反思','task'),body:`<div class="pad"><h1 class="page-heading">自检与反思</h1><p class="sub space-top-sm">${esc(c.title)} · 自检、心得、问题都归“思”</p><div class="section-title"><h2>课程专项自检</h2></div>${c.checks.length?c.checks.map(t=>`<div class="unit-material-preview">${icon('edit')}<span>${esc(t)}</span><small>表单待接入</small></div>`).join(''):notice('自检配套待法师确认','本课未明确自检表，不套用其他课程表单。')}${notice('必填规则与完成要求待确认','真实题目、评分及回向文本未接入。课程专项自检不能通过取消个人自检定课来免除。')}<div class="field"><label for="reflection">我的心得</label><textarea id="reflection" maxlength="1500" placeholder="记录这门课带给你的观察与体会">${esc(a.reflection)}</textarea></div><div class="field"><label for="question">想请教法师的问题</label><textarea id="question" maxlength="1000" placeholder="记录需要法师指导的地方">${esc(a.question)}</textarea></div>${a.reflectionAt?`<p class="plain-note">上次保存：${esc(a.reflectionAt)}</p>`:''}<p class="plain-note">保存心得不代表专项自检或整门课程已完成。</p>${ui.error?`<p class="error" role="alert">${esc(ui.error)}</p>`:''}</div>`,footer:foot('保存心得与问题','save-reflection','可随时修改；本次不会生成自检分数。')};}
function practice(){const c=courseById(current().courseId);return {bar:header('修 · 配套实践','task'),body:`<div class="pad"><h1 class="detail-title">${esc(c.title)} · 实践</h1>${notice('实践配套待法师确认','本课是否有独立实践、具体内容、目标与周期，均须先确认。不默认加入计数念佛、助念或拜佛任务。')}${c.id==='wholehearted'?'<p class="source-note">初稿明确关联“定课自检中的舍命念佛”，该自检归“思”；不据此推定实际实践范围或数量。</p>':''}${list(c.pending)}<p class="plain-note">念佛等持续实践可与课程同时安排。其与课程的绑定关系和完成要求，待法师确认后使用。</p></div>`,footer:foot('返回课程','return-task')};}
function submit(){const a=current(),c=courseById(a.courseId);return {bar:header('提交已学完','task'),body:`<div class="pad"><h1 class="detail-title">${esc(c.title)}</h1>${notice('暂不可提交完成','本课固定配套、真实资料和完成要求尚未齐备。已保存心得会保留，但不能据此认定课程已学完。')}<div class="section-title"><h2>尚需补齐</h2></div>${list(definitionGaps(c))}<div class="state-list"><div class="summary-row"><span>闻 · 资料进度</span><span class="value">待接入</span></div><div class="summary-row"><span>思 · 专项自检</span><span class="value">待接入／确认</span></div><div class="summary-row"><span>心得与问题</span><span class="value">${a.reflectionAt?'已保存':'尚未保存'}</span></div><div class="summary-row"><span>修 · 配套实践</span><span class="value">待确认是否适用</span></div></div><p class="plain-note">要求齐备后：学员提交 → 法师查看资料、自检答案与分数、心得及实践记录 → 确认本课完成。</p></div>`,footer:foot('配套确认后可提交','submit-course','不会自动完成或开放下一门课程。',true)};}
function checkOptions(student='m1'){const out=new Map();for(const a of owned(student).filter(a=>a.status!=='completed')){const c=courseById(a.courseId);for(const title of c.checks){const key=c.id+':'+title;if(!out.has(key))out.set(key,{id:key,title,courseId:c.id,branch:c.branch,formReady:false});}}return [...out.values()];}
function daily(){const options=checkOptions(),draft=ui.dailyDraft||data.daily;return {bar:header('我的自检定课','home'),body:`<div class="pad"><h1 class="page-heading">我的自检定课</h1><p class="sub space-top-sm">在法师已开放的范围内，按自身情况持续自检。</p>${notice('先保存选择，表单待接入','以下仅来自已安排课程、且初稿已明确对应的自检。设置不会开放其他课程，也不会生成完成记录。')}<div class="section-title"><h2>已开放课程中的自检</h2></div>${options.length?options.map(o=>`<label class="assign-option"><input type="checkbox" name="daily-check" value="${esc(o.id)}" ${draft.selected.includes(o.id)?'checked':''}><span><strong>${esc(o.title)}</strong><p>${esc(courseById(o.courseId).title)} · ${esc(o.branch)} · 表单待接入</p></span></label>`).join(''):'<p class="plain-note">暂无可选项，请先等待法师开放课程。</p>'}<div class="section-title"><h2>各门定课自检</h2></div>${['正信','正愿','正行'].map(b=>`<div class="unit-material-preview">${icon('lock')}<span>${b}定课自检</span><small>开放范围待确认</small></div>`).join('')}<div class="field"><label for="daily-time">自检时间</label><select id="daily-time">${['睡前','自定时间','不固定'].map(v=>`<option ${draft.time===v?'selected':''}>${v}</option>`).join('')}</select></div>${draft.time==='自定时间'?`<div class="field"><label for="daily-custom">时间</label><input id="daily-custom" type="time" value="${esc(draft.customTime)}"></div>`:''}<p class="plain-note">时间只保存为个人偏好，不设置全体统一提交时刻。取消选择不会取消本课专项自检要求。</p>${data.daily.saved?'<p class="review-stamp">已保存个人设置；表单接入后再填写、回向并记录。</p>':''}${ui.error?`<p class="error" role="alert">${esc(ui.error)}</p>`:''}${notice('填写流程待内容齐备后启用','选择已开放自检 → 填写 → 使用确认后的文本回向 → 完成本次。一次只保存一份记录；是否计入课程要求按法师确认规则执行。')}</div>`,footer:foot('保存个人自检定课','save-daily','不会代填自检、自动计分或判定课程完成。')};}
function journey(){const arr=owned(role==='teacher'?activeStudent:'m1').slice().sort((a,b)=>a.assignedAt.localeCompare(b.assignedAt));return {bar:header('修学历程',role==='teacher'?'student':'home'),body:`<div class="pad"><h1 class="page-heading">${role==='teacher'?person(activeStudent).name+'的':'我的'}修学历程</h1><p class="sub space-top-sm">按个人实际安排展示，多门课程可并行。</p><div class="tabs"><button data-action="journey-tab" data-value="arrangements" class="${ui.tab==='arrangements'?'active':''}">课程安排</button><button data-action="journey-tab" data-value="records" class="${ui.tab==='records'?'active':''}">学习记录</button></div>${ui.tab==='arrangements'?`<div class="journey-summary"><span>已安排 <b>${arr.length}</b> 门</span><span>已确认完成 <b>${arr.filter(a=>a.status==='completed').length}</b> 门</span></div><div class="personal-route">${arr.map(a=>`<div class="route-node planned"><span class="route-dot"></span><button class="route-content" data-go="${role==='teacher'?'review':'task'}" data-id="${a.id}"><span class="route-meta">${esc(a.created)} · 法师安排</span><span class="route-title">${esc(courseById(a.courseId).title)} ${icon('right')}</span><span class="route-path">${esc(branchOf(a))}课</span><span class="route-state">${tag(a)}</span></button></div>`).join('')}</div>${!arr.length?'<div class="empty"><h2>暂无课程安排</h2><p>法师安排后，历程会在这里记录。</p></div>':''}<p class="plain-note center">这里的顺序是安排时间，不是统一修学阶段。</p>`:`${arr.map(a=>row(role==='teacher'?'review':'records',courseById(a.courseId).title,a.events.length?`${a.events.length}条心得／指导记录`:'已安排，暂无学习记录','clock',`data-id="${a.id}"`)).join('')}<div class="section-title"><h2>日常自检记录</h2></div><p class="plain-note">暂无已完成的自检。真实表单及回向文本尚未接入，不生成填写、分数或实践样例。</p>`}</div>`,bottom:bottom(role==='teacher'?'students':'journey')};}
function records(){const a=current(),c=courseById(a.courseId);return {bar:header('课程学习记录','journey'),body:`<div class="pad"><h1 class="detail-title">${esc(c.title)}</h1><p class="sub">${esc(c.branch)}课 · ${status(a)}</p>${a.events.slice().reverse().map(e=>`<div class="record-line"><span class="row-icon">${icon(e.kind==='reflection'?'edit':'note')}</span><div><strong>${e.kind==='reflection'?'保存心得与问题':'法师调整指导与要求'}</strong><p>${esc(e.at)}</p>${e.text?`<p>${esc(e.text)}</p>`:''}${e.question?`<p>问题：${esc(e.question)}</p>`:''}${e.requirements?`<p>要求：${esc(e.requirements)}</p>`:''}</div></div>`).join('')}<div class="record-line"><span class="row-icon">${icon('book')}</span><div><strong>法师安排本课程</strong><p>${esc(a.created)} · 慧明法师</p></div></div><p class="plain-note">保存心得不会生成专项自检、回向或课程完成记录。</p></div>`,bottom:bottom('journey')};}
function learning(){const arr=owned();return {bar:header('已安排课程','home'),body:`<div class="pad"><h1 class="page-heading">我的课程</h1><p class="sub space-top-sm">法师安排的课程同时保留，各课独立记录。</p>${arr.map(a=>row('task',courseById(a.courseId).title,branchOf(a)+'课 · '+status(a),'book',`data-id="${a.id}"`)).join('')}${!arr.length?'<div class="empty"><h2>暂无安排</h2><p>公共导读可先行查看。</p></div>':''}</div>`,bottom:bottom('home')};}
function sourceTree(items){return `<ul class="source-tree">${items.map(x=>`<li><span>${esc(x.title)}</span>${x.children?.length?sourceTree(x.children):''}</li>`).join('')}</ul>`;}
function guide(){return {bar:header('公共导读','home'),body:`<div class="pad"><h1 class="page-heading">导读</h1><p class="sub space-top-sm">公共开放 · 不计入四类24门</p>${MAP.publicGuide.children.map(g=>`<div class="unit-material-preview">${icon('book')}<span>${esc(g.title)}</span><small>资料待接入</small></div>`).join('')}${notice('导读资料待接入','目录公开可见，实际文件尚未接入。原导图中的数字不当作课时或完成指标。')}<div class="section-title"><h2>导读下的其他内容</h2></div>${MAP.introExtras.map(g=>`<div class="unit-material-preview">${icon('lock')}<span>${esc(g.title)}</span><small>配套范围待确认</small></div>`).join('')}<p class="plain-note">皈依、早晚定课、入门自检保留导图位置，不并入24门，不默认开放。</p></div>`,bottom:bottom('home')};}
function directory(){const teacher=role==='teacher';return {bar:header('原图行门目录',teacher?'assign':'home'),body:`<div class="pad"><h1 class="page-heading">行门内容保留</h1><p class="sub space-top-sm">用于课程配置阶段核对，不能在日常安排中逐项指派。</p>${teacher?`${MAP.sourceGroups.filter(g=>['正人','正信','正愿','正行'].includes(g.path)).map(g=>`<details class="source-group"><summary>${esc(g.path)} → ${esc(g.title)}</summary>${g.children?.length?sourceTree(g.children):'<p class="plain-note">具体表单与使用范围待确认。</p>'}<p class="source-note">随哪门课开放、是否共用以及完成要求，待法师确认；不默认绑定全部课程。</p></details>`).join('')}${notice('归属保留，不猜配','正信七信自检下的8个可见条目、正愿各类戒律、正行计数与助念等均保留。正行念佛总数仍为记录指标。')}`:notice('行门配套随课程开放','未安排的课程内容不会从此处开放。请从首页已安排课程进入。')}</div>`};}
function pending(){return {bar:header('待法师确认','assign'),body:`<div class="pad"><h1 class="page-heading">课程配套待确认</h1><p class="sub space-top-sm">先确认固定课程配置，再用于日常教学安排。</p>${list(MAP.pendingRules)}${notice('当前演示边界','24门课程可演示选择与安排；实际配套、资料、表单与完成规则未齐备，不能提交或确认完成。')}${row('directory','核对原图行门目录','完整保留，未指定的配套不自行绑定','list')}</div>`};}

function teacherStudent(){return {bar:header('学员修学','students'),body:`<div class="pad"><div class="profile"><span class="avatar">${person(activeStudent).initial}</span><div><h1>${person(activeStudent).name}</h1><p>多课并行 · 法师确认结课</p></div></div><button class="primary" data-go="assign">${icon('plus')} 安排课程</button>${row('journey','修学历程与学习记录','按个人实际安排展示','path')}${owned(activeStudent).map(a=>row('review',courseById(a.courseId).title,branchOf(a)+'课 · '+status(a),'book',`data-id="${a.id}"`)).join('')}${!owned(activeStudent).length?'<div class="empty"><h2>尚未安排课程</h2></div>':''}</div>`,bottom:bottom('students')};}
function assign(){const selected=ui.selected.filter(id=>courseById(id)&&!isOpened(courseById(id),activeStudent));const items=COURSES.filter(c=>ui.filter==='全部'||c.branch===ui.filter);return {bar:header('安排课程','student'),body:`<div class="pad"><h1 class="page-heading">给${person(activeStudent).name}安排课程</h1><p class="sub space-top-sm">选一门或多门，填写指导与要求。新增课程保留原有安排。</p><div class="course-counts">${['正人','正信','正愿','正行'].map(b=>`<span><b>${COURSES.filter(c=>c.branch===b).length}</b>${b}课</span>`).join('')}</div><div class="unit-filters" aria-label="课程分类">${['全部','正人','正信','正愿','正行'].map(b=>`<button class="chip ${ui.filter===b?'active':''}" data-action="course-filter" data-value="${b}" aria-pressed="${ui.filter===b}">${b}</button>`).join('')}</div><div class="section-title"><h2>固定课程目录</h2><span class="sub">共24门</span></div>${items.map(c=>`<div class="unit-choice"><label><input type="checkbox" name="assign-course" value="${c.id}" ${selected.includes(c.id)?'checked':''} ${isOpened(c,activeStudent)?'disabled':''}><span><strong>${esc(c.title)}</strong><small>${esc(c.branch)}课 · ${isOpened(c,activeStudent)?'已安排':'配套待法师确认'}</small></span></label><div class="unit-choice-foot"><span>正见＋对应行门</span><button class="text-button" data-go="course" data-course="${c.id}">查看配置 ${icon('right')}</button></div></div>`).join('')}${selected.length?`<div class="section-title"><h2>本次选择 ${selected.length}门</h2></div>${selected.map(id=>`<div class="selected-source"><span>${esc(courseById(id).branch)} · ${esc(courseById(id).title)}</span><button class="icon-btn" data-action="remove-course" data-course="${id}" aria-label="移除${esc(courseById(id).title)}">${icon('close')}</button></div>`).join('')}`:''}<div class="field"><label for="assign-guidance">本次指导</label><textarea id="assign-guidance" maxlength="1000" placeholder="填写给这位学员的指导">${esc(ui.guidance)}</textarea></div><div class="field"><label for="assign-requirements">本次要求</label><textarea id="assign-requirements" maxlength="1000" placeholder="填写学习安排与提醒，不替代待确认的固定课程规则">${esc(ui.requirements)}</textarea></div>${notice('演示安排 · 配套待确认','发布后学员可查看课程结构、保存心得与问题。固定配套仍待法师确认，不据此开放未确认表单、默认实践或判定完成。')}${row('pending','7类待法师确认的问题','不在本次安排时逐项猜配','question')}${row('directory','完整行门目录','仅供核对，不拆成日常指派小课','list')}${ui.error?`<p class="error" role="alert">${esc(ui.error)}</p>`:''}</div>`,footer:foot(selected.length?`发布${selected.length}门演示安排`:'请选择课程','publish-assignment','演示数据仅保存在本浏览器。',!selected.length)};}
function review(){const a=current(),c=courseById(a.courseId);return {bar:header('查看课程学习','student'),body:`<div class="pad"><div class="breadcrumb">${person(a.student).name} · ${esc(c.branch)}课</div><h1 class="detail-title">${esc(c.title)}</h1>${tag(a)}<div class="guidance"><div class="guidance-head">本次指导</div><p>${esc(a.guidance)}</p>${a.requirements?`<p>本次要求：${esc(a.requirements)}</p>`:''}</div><button class="text-button" data-go="configure">修改本次指导与要求 ${icon('right')}</button><div class="section-title"><h2>学员心得</h2></div><p class="summary-prose">${esc(a.reflection)||'尚未保存心得。'}</p><div class="section-title"><h2>向法师请教</h2></div><p class="summary-prose">${esc(a.question)||'暂无问题。'}</p>${a.reflectionAt?`<p class="plain-note">保存时间：${esc(a.reflectionAt)}</p>`:''}${pairing(c)}${notice('尚不可确认结课','实际资料进度、专项自检的答案与分数、实践记录及课程完成要求未齐备，不能确认完成。')}${row('course','查看固定课程配置','已明确对应与待确认配套','list',`data-course="${c.id}"`)}</div>`,footer:foot('配套补齐并提交后可确认','approve-course','心得保存与单次自检不等于课程完成。',true)};}
function configure(){const a=current();return {bar:header('修改指导与要求','review'),body:`<div class="pad"><h1 class="detail-title">${esc(courseById(a.courseId).title)}</h1><p class="sub">只修改本次教学安排，固定课程配套仍按设计阶段确认结果。</p><div class="field"><label for="config-guidance">法师指导</label><textarea id="config-guidance" maxlength="1000">${esc(a.guidance)}</textarea></div><div class="field"><label for="config-requirements">本次要求</label><textarea id="config-requirements" maxlength="1000">${esc(a.requirements)}</textarea></div>${notice('固定配置不在日常指派时修改','不提供逐张选择自检、随意配置戒律或给所有课程添加实践的开关。')}</div>`,footer:foot('保存指导与要求','save-configuration')};}
function published(){const items=ui.published.map(id=>data.assignments.find(a=>a.id===id)).filter(Boolean);return {bar:header('课程已安排','student'),body:`<div class="pad"><div class="success-state"><div class="success-mark">${icon('check')}</div><h1>已为${person(activeStudent).name}安排</h1><p>新增安排已保留，原有课程不被覆盖。</p></div>${items.map(a=>row('review',courseById(a.courseId).title,'演示安排 · 配套待法师确认','book',`data-id="${a.id}"`)).join('')}${notice('待确认配套继续保留','学员可以查看课程结构、记录心得与问题。未接入的资料和表单不会生成已学完或评分。')}${row('student','查看学员全部安排','可继续安排其他课程','users')}</div>`};}
function historyPage(){return {bar:header('安排记录','students'),body:`<div class="pad"><h1 class="page-heading">历次课程安排</h1>${data.assignments.slice().reverse().map(a=>row('review',courseById(a.courseId).title,person(a.student).name+' · '+a.created+' · '+status(a),'book',`data-id="${a.id}"`)).join('')}</div>`,bottom:bottom('arrangement-history')};}
const links=()=>role==='teacher'?[['students','users','我的学员'],['student','user','学员修学'],['assign','plus','安排24门课程'],['review','book','查看课程学习'],['pending','question','待法师确认'],['directory','list','原图行门目录'],['arrangement-history','clock','安排记录'],['profile','user','我的']]:[['home','home','今日修学'],['task','book','本课闻思修'],['learning','list','已安排课程'],['journey','path','历程与记录'],['daily','clock','我的自检定课'],['guide','leaf','公共导读'],['profile','user','我的']];
function sidebar(){return `<aside class="preview-sidebar"><div class="preview-brand"><div class="brand-mark">${icon('lotus')}</div><div><strong>人间净土</strong><p>四类24门 · 手机交互原型</p></div></div><div class="role-switch" aria-label="预览角色"><button data-role="student" class="${role==='student'?'active':''}">学员端</button><button data-role="teacher" class="${role==='teacher'?'active':''}">法师端</button></div><div class="side-heading">页面导航</div><nav class="preview-links">${links().map(([to,ic,label])=>`<button data-go="${to}" class="${page===to?'active':''}">${icon(ic)}${label}</button>`).join('')}</nav><div class="preview-note">人物与安排为演示。<br>课程依据《五正课程设计初稿》。<br>${recovery?'本地数据无法读取，重置演示后可保存。':storageError?'保存未成功，请保留页面并重试。':'操作仅保存在本浏览器，刷新可继续。'}</div><div class="side-actions"><button data-action="design-rules">课程规则</button><button data-action="reset-demo">重置示例</button></div></aside>`;}
function pageInfo(){const map={home:['莲花进入课程','保留正见的“解”和四个行门的“行”。正见汇总已开放课程的理论；四瓣对应四类课程。'],assign:['按完整课程安排','正人8门、正信7门、正愿2门、正行7门。先确认固定配套，再用于日常安排；当前发布为演示。'],course:['正见与行门组成一门课','理论路径、已明确对应、待法师确认的配套分开展示。不把资料和表单拆成日常逐项指派的小课。'],think:['自检、心得与问题归思','保存心得可以与配套确认并行。未接入实际表单，不生成通用题、分数或完成记录。'],daily:['个人自检定课','在已开放课程内自行选择，不改变专项自检必填要求。定课自检的开放范围和真实表单仍待确认。'],journey:['实际安排形成历程','以指派时间呈现个人课程；学习记录合并在这里。四类24门不是统一晋级阶段。'],review:['由法师确认完成','资料进度、自检答案与分数、心得和实践记录齐备后才能判断完成。当前缺口继续保留。'],directory:['完整保留行门目录','按原图归属留存，不自行配给某门课，不因为24门包装删除内容。'],practice:['不强加独立实践','实践配套与要求待法师确认，不预设念佛、拜佛或助念。没有独立实践的课程不强行添加修。']};return map[page]||['课程结构已调整','四类24门＋公共导读。多课并行，学员提交、法师确认；未知配套和真实资料缺口明确标注。'];}
function modal(){if(!ui.modal)return '';let title=ui.infoTitle,body=`<p>${esc(ui.infoBody)}</p>`,buttons=primary('知道了','close-modal');if(ui.modal==='reset'){title='重置本版演示';body='<p>恢复24门课程版初始安排，清除本版心得和定课设置。旧版v4记录仍保存在旧存储键中。</p>';buttons=`<div class="sheet-actions">${primary('取消','close-modal')}${primary('重置示例','confirm-reset')}</div>`;}if(ui.modal==='pages'){title='切换页面';body=`<div class="role-switch"><button data-role="student">学员端</button><button data-role="teacher">法师端</button></div><nav class="preview-links">${links().map(([to,ic,label])=>`<button data-go="${to}">${icon(ic)}${label}</button>`).join('')}</nav>`;body+='<div class="side-actions"><button data-action="design-rules">课程规则</button><button data-action="reset-demo">重置示例</button></div>';buttons='';}return `<div class="modal" data-action="modal-backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="sheet-head"><h2 id="dialog-title" tabindex="-1">${esc(title)}</h2><button class="icon-btn" data-action="close-modal" aria-label="关闭">${icon('close')}</button></div>${body}${buttons}</section></div>`;}
function render(preserve=false){const scroll=preserve?$('.phone-content')?.scrollTop||0:0;const views={home,course,task,read,think,practice,submit,daily,journey,records,learning,guide,directory,pending,profile,students:teacherHome,student:teacherStudent,assign,review,configure,published,'arrangement-history':historyPage};const view=views[page](),[title,desc]=pageInfo();$('#app').innerHTML=`<div class="mobile-tools"><span class="mini-brand">人间净土 · 24门课程原型</span><button data-action="page-menu">${role==='teacher'?'法师端':'学员端'} · 页面导航</button></div><main class="preview">${sidebar()}<div class="phone-wrap"><section class="phone" aria-label="${role==='teacher'?'法师':'学员'}端手机原型">${statusBar()}<div class="phone-viewport">${view.bar||''}<div class="phone-content" id="screen-content">${view.body}</div>${view.footer||''}${view.bottom||''}${ui.toast?`<div class="toast" role="status">${esc(ui.toast)}</div>`:''}${modal()}</div><div class="gesture" aria-hidden="true"></div></section></div><aside class="preview-context"><div class="context-line"></div><h2>${title}</h2><p>${desc}</p><div class="flow-index">${['法师选课安排','闻 · 讲解资料','思 · 自检与反思','修 · 适用的实践','提交 · 法师确认'].map((v,i)=>`<span class="${i===(page==='read'?1:page==='think'?2:page==='practice'?3:['submit','review'].includes(page)?4:0)?'active':''}"><i>${i+1}</i>${v}</span>`).join('')}</div><p class="scope-note">课程设计：正人8门＋正信7门＋正愿2门＋正行7门。公共导读单独保留。配套先由法师确认后固定；当前不编造资料、题目或完成标准。</p></aside></main>`;$('.phone-content').scrollTop=scroll;if(ui.modal){document.querySelectorAll('.phone-content,.bottom-nav,.app-bar,.action-footer').forEach(e=>e.inert=true);requestAnimationFrame(()=>$('#dialog-title')?.focus());}scalePhone();}
function scalePhone(){const wide=innerWidth>1080,side=innerWidth>700,w=side?innerWidth-(wide?609:318):innerWidth-36,h=innerHeight-(side?54:76);document.documentElement.style.setProperty('--phone-scale',Math.max(.35,Math.min(1,w/413,h/852)).toFixed(4));}
function now(){return new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Shanghai'}).format(new Date());}
function publishCourses(ids,student,guidance,requirements){const selected=[...new Set(ids)].filter(id=>courseById(id)&&!isOpened(courseById(id),student));const created=selected.map((id,i)=>newAssignment(id,student,'course-'+Date.now()+'-'+i,{guidance:guidance.trim()||'请按本课已确认内容修学，有问题可记录后向法师请教。',requirements:requirements.trim()}));data.assignments.push(...created);return created;}
function dailyDraft(){if(!ui.dailyDraft)ui.dailyDraft=JSON.parse(JSON.stringify(data.daily));return ui.dailyDraft;}

 'select-lotus':btn=>{if(!LOTUS_BRANCHES.some(b=>b.name===btn.dataset.branch))return;ui.lotusBranch=btn.dataset.branch;render(true);document.querySelector(`[data-branch="${ui.lotusBranch}"]`)?.focus({preventScroll:true});},

 'choose-course':()=>{if(role!=='teacher'||isOpened(courseById(courseId),activeStudent))return;ui.selected=[...new Set([...ui.selected,courseId])];navigate('assign');},
 'publish-assignment':()=>{if(role!=='teacher')return;const created=publishCourses(ui.selected,activeStudent,ui.guidance,ui.requirements);if(!created.length)return;ui.published=created.map(a=>a.id);ui.selected=[];ui.guidance='';ui.requirements='';persist();navigate('published');},
 'save-configuration':()=>{if(role!=='teacher')return;const a=current();a.guidance=$('#config-guidance').value.trim();a.requirements=$('#config-requirements').value.trim();a.events.push({kind:'guidance',at:now(),text:a.guidance,requirements:a.requirements});persist();navigate('review');flash('本次指导与要求已保存');},
 'submit-course':()=>{if(!canSubmit(current()))openInfo('暂不可提交','固定课程配置、实际资料与完成要求未齐备。');},
 'approve-course':()=>{if(!canSubmit(current()))openInfo('暂不可确认','需要真实学习记录、明确完成要求和学员提交。');},
};
document.addEventListener('click',event=>{const roleBtn=event.target.closest('[data-role]');if(roleBtn){switchRole(roleBtn.dataset.role);return;}const go=event.target.closest('[data-go]');if(go){if(go.disabled)return;const id=go.dataset.id;if(id&&role==='teacher'){const a=data.assignments.find(a=>a.id===id);if(a)activeStudent=a.student;}navigate(go.dataset.go,{id,student:go.dataset.student,course:go.dataset.course});return;}const btn=event.target.closest('[data-action]');if(!btn||btn.disabled)return;if(btn.dataset.action==='modal-backdrop'){if(event.target===btn){ui.modal=null;render(true);}return;}actions[btn.dataset.action]?.(btn);});
document.addEventListener('input',event=>{const e=event.target;if(e.id==='assign-guidance')ui.guidance=e.value;if(e.id==='assign-requirements')ui.requirements=e.value;if(e.id==='reflection'&&role==='student')current().reflection=e.value;if(e.id==='question'&&role==='student')current().question=e.value;if(e.id==='daily-custom')dailyDraft().customTime=e.value;if(e.id==='student-search'){ui.search=e.value;$('#student-results').innerHTML=studentRows();}});
document.addEventListener('change',event=>{const e=event.target;if(e.name==='assign-course'){ui.selected=e.checked?[...new Set([...ui.selected,e.value])]:ui.selected.filter(id=>id!==e.value);render(true);}if(e.name==='daily-check'){const draft=dailyDraft();draft.selected=e.checked?[...new Set([...draft.selected,e.value])]:draft.selected.filter(id=>id!==e.value);}if(e.id==='daily-time'){dailyDraft().time=e.value;render(true);}});
document.addEventListener('keydown',event=>{const petal=event.target.closest?.('svg [role="button"]');if(petal&&['Enter',' '].includes(event.key)){event.preventDefault();petal.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;}if(!ui.modal)return;if(event.key==='Escape'){ui.modal=null;render(true);}if(event.key==='Tab'){const nodes=[...document.querySelectorAll('.sheet button:not(:disabled),.sheet input,.sheet textarea,.sheet select')],first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement?.id==='dialog-title')){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
addEventListener('resize',scalePhone);
addEventListener('popstate',()=>{params=routeParams();role=params.get('role')==='teacher'?'teacher':'student';page=params.get('page')||(role==='teacher'?'students':'home');activeStudent=params.get('student')||'m1';activeId=params.get('task')||'karma';courseId=params.get('course')||'karma';normalizeRoute();ui.modal=null;ui.error='';render();});
history.replaceState(null,'',url());
render();
})();

</script>
</body>
