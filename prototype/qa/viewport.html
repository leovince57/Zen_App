<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原型布局核对</title><style>body{margin:0;padding:16px;background:#d9ddd2;font:13px system-ui;color:#293329}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}button{padding:8px;border:1px solid #83917c;background:#fffef9;border-radius:5px}#stage{margin:auto;position:relative}iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left}output{display:block;margin:12px 0;font-size:12px}</style><header><strong>原型布局核对</strong><button data-w="1280" data-h="960">桌面1280</button><button data-w="375" data-h="812">手机375</button><button data-w="320" data-h="700">小屏320</button><a href="../">返回原型</a></header><div id="stage"><iframe title="原型响应式预览" src="../"></iframe></div><output></output><script>let w=1280,h=960;function size(){const s=Math.min(1,(innerWidth-32)/w,(innerHeight-125)/h);const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px';f.style.transform='scale('+s+')';const stage=document.querySelector('#stage');stage.style.width=w*s+'px';stage.style.height=h*s+'px';}document.addEventListener('click',e=>{if(e.target.dataset.w){w=Number(e.target.dataset.w);h=Number(e.target.dataset.h);size();}});addEventListener('resize',size);setInterval(()=>{const d=document.querySelector('iframe').contentDocument;document.querySelector('output').textContent='子页面视口 '+w+'×'+h+' · 文档宽度 '+d.documentElement.scrollWidth+' · 手机内容宽度 '+(d.querySelector('.phone-content')?.clientWidth||0)+' / '+(d.querySelector('.phone-content')?.scrollWidth||0);},500);size();</script></html>
